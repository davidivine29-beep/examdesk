async function beginCheck(){
  const f=S.form,fail=m=>{S.err=m;render();};
  const c=f.cid?cls(f.cid):null;
  if(!c)return fail('Choose your class.');
  if(c.locked)return unlockClass();
  if(!f.name)return fail('Choose your name from the list.');
  const ex=c.exams.find(e=>e.id===f.eid&&examWhen(e,Date.now())==='open');
  if(!ex)return fail('Choose a subject.');
  if(c.code&&nk(f.code)!==nk(c.code))return fail('The access code is not correct.');
  if(resFor(c.id,f.name,ex.id))return fail(f.name+' has already written this subject. Ask your teacher if you need to write it again.');
  S.cand={cid:c.id,name:f.name};
  const sv=store.get(K_SES);
  if(sv&&sv.cid===c.id&&nk(sv.name)===nk(f.name)&&sv.exam.id===ex.id&&sv.endsAt>Date.now()){S.ses=sv;S.view='exam';render();return;}
  S.err='';S.view='intro';window.scrollTo(0,0);render();
}

/* ---------- file handlers ---------- */
async function handleDocx(file){
  const st=S.st;st.err='';
  try{
    const r=classify(await readDocx(file));
    st.imp=r;if(!r.exams.length)st.err='No questions were found in that file. Check the format notes below.';
  }catch(e){st.imp=null;st.err=e.message==='nolib'?'The .docx reader did not load. Paste the questions as text instead.':'That file could not be read as a .docx paper.';}
  render();
}
async function handleRoster(file){
  const st=S.st,c=cls(st.cid);
  try{
    const sheets=await readWorkbook(file);
    if(!sheets.length)throw new Error('empty');
    let pick=sheets.findIndex(s=>normClass(s.name)===normClass(c.name));
    if(pick<0)pick=sheets.findIndex(s=>rosterFromRows(s.rows).names.length>0);
    if(pick<0)pick=0;
    st.rimp={file:file.name,sheets,pick};
  }catch(e){st.rimp={file:file.name,err:e.message==='nolib'?'The spreadsheet reader did not load. Type or paste the names below instead.':'That file could not be read as a spreadsheet.'};}
  render();
}
async function handleBulk(file){
  const st=S.st;
  try{
    const sheets=await readWorkbook(file);
    st.bulk={items:sheets.map(s=>{
      const parsed=rosterFromRows(s.rows),m=W.classes.find(c=>normClass(c.name)===normClass(s.name));
      return {sheet:s.name,parsed,cid:m?m.id:'',include:parsed.names.length>0};
    })};
    if(!st.bulk.items.length)st.bulk={err:'That workbook has no sheets.'};
  }catch(e){st.bulk={err:e.message==='nolib'?'The spreadsheet reader did not load.':'That file could not be read as a spreadsheet.'};}
  render();
}
async function handleSetupFile(file){
  const st=S.st;
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.kind!=='xd-setup'||!j.setup||!Array.isArray(j.setup.classes))throw new Error('bad');
    st.pending={kind:'setup',name:file.name,data:j.setup};
  }catch(e){st.pending=null;toast('That is not an ExamDesk setup file.');}
  render();
}
async function handleResultsFile(file){
  const st=S.st;
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.kind!=='xd-results'||!Array.isArray(j.results))throw new Error('bad');
    const have=new Set(R.map(r=>r.id)),seen=new Set(R.map(r=>r.cid+'|'+nk(r.name)+'|'+r.eid+'|'+r.submittedAt));
    let add=0;
    j.results.forEach(r=>{
      const k=r.cid+'|'+nk(r.name)+'|'+r.eid+'|'+r.submittedAt;
      if(r&&r.id&&!have.has(r.id)&&!seen.has(k)){R.push(r);have.add(r.id);seen.add(k);add++;}
    });
    let mAdd=0;
    if(j.marks&&typeof j.marks==='object'){const ids=new Set(R.map(x=>x.id));Object.keys(j.marks).forEach(rid=>{if(!ids.has(rid))return;Object.keys(j.marks[rid]||{}).forEach(q=>{if(mergeMark(rid,q,j.marks[rid][q])){mAdd++;MQ.add(rid+'|'+q);}});});if(mAdd)saveMK();}
    saveR();st.flash=add+' result'+(add===1?'':'s')+' merged in, '+(j.results.length-add)+' already here.'+(mAdd?' '+mAdd+' mark change'+(mAdd===1?'':'s')+' merged too.':'');
  }catch(e){toast('That is not an ExamDesk results file.');}
  render();
}

  const t=e.target,st=S.st;
  if(t.dataset.bind&&t.tagName==='SELECT'){
    setPath(t.dataset.bind,t.value);
    if(t.dataset.bind==='form.cid'){S.form.name='';S.form.eid='';S.form.code='';S.form.ucode='';S.err='';}
    if(t.dataset.bind==='form.name'){S.form.eid='';S.err='';}
    render();return;
  }
  if(t.dataset.asel!==undefined){rcSt().script=t.value;render();return;}
  if(t.dataset.rckind!==undefined){rcSt().kind=t.value==='mid'?'mid':t.value==='annual'&&hasTier('campus')?'annual':'end';render();return;}
  if(t.dataset.rcpos){const c=cls(st.cid);if(c){c.rcPos=t.checked;saveW();render();}return;}
  if(t.dataset.clt){const c=cls(st.cid);if(c){c.teacher=String(t.value).trim().slice(0,80);saveW();}return;}
  if(t.dataset.ai){const c=cls(st.cid);if(!c)return;const k=cmKid(c,t.dataset.n);k.ai[t.dataset.ai]=String(t.value).trim().slice(0,600);saveW();return;}
  if(t.dataset.kid){const c=cls(st.cid);if(!c)return;c.kids=c.kids||{};const k=nk(t.dataset.n);c.kids[k]=c.kids[k]||{};c.kids[k][t.dataset.kid]=String(t.value).trim().slice(0,600);saveW();return;}
  if(t.dataset.rc){rcSt().school=true;W.report=Object.assign({},W.report||{});
    if(t.dataset.rc==='wMid'||t.dataset.rc==='wEnd'){const v=parseInt(t.value,10);if(!(v>=1&&v<=100)){render();return;}W.report[t.dataset.rc]=v;}
    else W.report[t.dataset.rc]=String(t.value).trim().slice(0,200);
    saveW();return;}
  if(t.dataset.rcphoto&&t.files&&t.files[0]){const c=cls(st.cid),rc=rcSt();rc.err='';
    try{await phSet(phKey(c,t.dataset.rcphoto),await imgData(t.files[0],'photo'));}catch(e){rc.err='That picture could not be read. Use a JPG or PNG.';}
    render();return;}
  if(t.id==='rc-logo'&&t.files&&t.files[0]){const rc=rcSt();rc.err='';rc.school=true;
    try{W.report=Object.assign({},W.report||{});W.report.logo=await imgData(t.files[0],'logo');saveW();}catch(e){rc.err='That logo could not be read. Use a JPG or PNG.';}
    render();return;}
  if(t.dataset.bpick){bankSt().pick[t.dataset.bpick]=t.checked;render();return;}
  if(t.id==='b-find'){render();const f=document.getElementById('b-find');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length);}return;}
  if(t.dataset.rs==='pick'){st.rimp.pick=+t.value;render();return;}
  if(t.dataset.bk){
    const it=st.bulk.items[+t.dataset.i];
    if(t.dataset.bk==='inc')it.include=t.checked;else it.cid=t.value;
    return;
  }
  if(t.dataset.xe&&extChange(t))return;
  if(t.dataset.ex){
    const c=cls(st.cid),ex=c&&c.exams.find(x=>x.id===t.dataset.ex),k=t.dataset.k;if(!ex)return;
    if(k==='draw'){const nm=t.dataset.draw,us=secUnits(ex,nm).length,v=parseInt(t.value,10);ex.draw=ex.draw||{};if(!(v>=1)||v>=us)delete ex.draw[nm];else ex.draw[nm]=v;if(!Object.keys(ex.draw).length)delete ex.draw;applyDraw(ex);saveW();reindex();render();return;}
    if(k==='opensAt'||k==='closesAt'){const v=t.value?new Date(t.value).getTime():0;if(v)ex[k]=v;else delete ex[k];if(ex.opensAt&&ex.closesAt&&ex.closesAt<=ex.opensAt){delete ex[k];toast('The closing time must be after the opening time.');}saveW();render();return;}
    if(k==='term'){ex.term=t.value==='mid'||t.value==='end'?t.value:'';saveW();render();return;}
    if(t.type==='checkbox'){ex[k]=t.checked;}
    else if(t.type==='number'){const v=parseInt(t.value,10);if(isNaN(v))return;ex[k]=k==='passMark'?Math.min(100,Math.max(0,v)):Math.min(360,Math.max(1,v));}
    else{const v=cleanName(t.value);if(!v)return;ex[k]=v;}
    saveW();reindex();
    if(t.type==='checkbox'||k==='theoryMode')render();
    return;
  }
  if(t.dataset.arm!==undefined){
    const c=cls(st.cid);if(!c)return;
    c.armOf=c.armOf||{};
    if(t.value)c.armOf[t.dataset.arm]=t.value;else delete c.armOf[t.dataset.arm];
    saveW();return;
  }
  if(t.dataset.tcr&&st.tc&&st.tc.form){
    const row=st.tc.form[t.dataset.tcr][+t.dataset.i];if(!row)return;
    row[t.dataset.k]=t.value;
    if(t.dataset.k==='cid'){row.arm='';row.subject=t.dataset.tcr==='subj'?(tcSubjects(t.value)[0]||''):'';}
    render();return;
  }
  if(t.dataset.cl){
    const c=cls(st.cid);if(!c)return;
    const k=t.dataset.cl;
    if(k==='arms'){
      const list=[];t.value.split(',').map(cleanName).filter(Boolean).forEach(a=>{if(!list.some(x=>nk(x)===nk(a)))list.push(a);});
      c.arms=list.slice(0,12);
      Object.keys(c.armOf||{}).forEach(n=>{if(!c.arms.includes(c.armOf[n]))delete c.armOf[n];});
      saveW();render();return;
    }
    if(k==='showRank')c[k]=t.checked;
    else if(k==='name'){const v=cleanName(t.value);if(!v)return;c.name=v;}
    else if(k==='code'){const v=cleanName(t.value);if(c.code&&nk(c.code)!==nk(v))c.prevCodes=(c.prevCodes||[]).filter(x=>nk(x)!==nk(c.code)).concat(c.code).slice(-20);c.code=v;if(SA&&SRVS.on&&!v){saveW();render();return;}}
    else c[k]=cleanName(t.value);
    saveW();return;
  }
  if(t.dataset.mkname){store.set(K_MARKER,cleanName(t.value));return;}
  if(t.dataset.tcoff){if(st.tc&&st.tc.form)st.tc.form.officer=t.checked;return;}
  if(t.dataset.pm!==undefined){pmSt()[t.dataset.pm]=t.value;return;}
  if(t.dataset.pmx==='papers'){rcSt().promoPapers=t.checked;return;}
  if(t.dataset.wl){W.wl=Object.assign({},W.wl||{});if(t.dataset.wl==='on')W.wl.on=t.checked;else if(t.dataset.wl==='color')W.wl.color=t.value;saveW();render();return;}
  if(t.id==='wl-logo'&&t.files&&t.files[0]){try{W.report=Object.assign({},W.report||{});W.report.logo=await imgData(t.files[0],'logo');saveW();}catch(e){toast('That logo could not be read. Use a JPG or PNG.');}render();return;}
  if(t.dataset.set==='school'){W.school=cleanName(t.value);saveW();return;}
  if(t.id==='f-docx'&&t.files[0]){await handleDocx(t.files[0]);return;}
  if(t.id==='f-roster'&&t.files[0]){await handleRoster(t.files[0]);return;}
  if(t.id==='f-extscores'&&t.files[0]){await extChange(t,true);t.value='';return;}
  if(t.id==='f-bulk'&&t.files[0]){await handleBulk(t.files[0]);return;}
  if(t.id==='f-setup'&&t.files[0]){await handleSetupFile(t.files[0]);return;}
  if(t.id==='f-results'&&t.files[0]){await handleResultsFile(t.files[0]);return;}
});
$app.addEventListener('toggle',e=>{
  const d=e.target;if(!d.dataset||!d.dataset.dx)return;
  const set=new Set(S.st.openDx||[]);
  if(d.open)set.add(d.dataset.dx);else set.delete(d.dataset.dx);
  S.st.openDx=[...set];
},true);
$app.addEventListener('dragover',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over');}});
$app.addEventListener('dragleave',e=>{const d=e.target.closest('.drop');if(d)d.classList.remove('over');});
$app.addEventListener('drop',async e=>{
  const d=e.target.closest('.drop');if(!d)return;
  e.preventDefault();
  const f=e.dataTransfer.files[0];if(!f)return;
  if(d.id==='drop-docx')await handleDocx(f);
  else if(d.id==='drop-roster')await handleRoster(f);
  else if(d.id==='drop-bulk')await handleBulk(f);
});
document.addEventListener('keydown',e=>{
  if(S.view!=='exam'||S.confirmSubmit||!S.ses)return;
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'||k==='n'){act('next');}
  else if(k==='arrowleft'||k==='p'){act('prev');}
  else if(k==='f'){act('flag');}
  else if(k.length===1&&'abcdefgh'.includes(k)){
    const i=k.charCodeAt(0)-97,{e:ee}=curQ();
    if(i<ee.perm.length){act('pick',{dataset:{k:String(i)}});}
  }
});
window.addEventListener('beforeunload',e=>{if(S.view==='exam'){e.preventDefault();e.returnValue='';}});

/* ---------- boot ---------- */
(function boot(){
  const st=S.st;
  applyBrand();
  if(bootNote)st.note=bootNote;
  if(W.pub)applyUnlocks();
  const au=ses.get(K_AUTH);
  if(au&&W.adminHash&&(au===W.adminHash||(W.adminHash==='srv'&&au.length===64)))st.authed=true;
  const af=ses.get(K_AFTER);
  let resumed=false;
  if(af){
    ses.del(K_AFTER);
    S.view='staff';st.page=af.page||'setup';st.flash=af.flash||'';
  }else{
    const sv=store.get(K_SES);
    if(sv&&sv.exam&&sv.qs){
      S.ses=sv;resumed=true;
      if(sv.endsAt<=Date.now()){finish(true);}
      else{S.view='exam';}
    }
  }
  if(!resumed||S.view==='exam')render();
  try{
    if(SA){ART=null;if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
      if(/^https?:$/.test(location.protocol)){syncServer();window.addEventListener('online',()=>syncServer());document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncServer();});setInterval(()=>{if(!document.hidden)syncServer();},90000);}}
    else if(window.claude&&claude.use){claude.use('artifact').then(a=>{ART=a||null;if(S.view==='staff'&&S.st.page==='setup')render();},()=>{ART=null;});}
    else ART=null;
  }catch(e){ART=null;}
})();
})();
</script>
