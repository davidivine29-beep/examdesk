<title>ExamDesk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16324F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ExamDesk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style id="xd-style">
/* Layout: candidates get one card with three dropdowns (class, name, subject). Examiners get a class-centred desk: class cards, then per class a register (children down, subjects across), papers, class list, analysis. Each class carries its own accent colour. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --ink:#142038; --muted:#56637E; --line:#D3DAE7; --soft:#E5EAF4;
  --brand:#1F3A8A; --on-brand:#FFFFFF; --ok:#12795A; --ok-soft:#DDF2EA; --warn:#A8530A; --warn-soft:#FBEBD3; --bad:#B42318; --bad-soft:#FBE3E0;
  --h1:#2B55D6; --h1s:#E2E9FC; --h2:#0C7F72; --h2s:#D6F0EB; --h3:#A9540C; --h3s:#F8E8D4;
  --h4:#B2336A; --h4s:#F8DFEA; --h5:#55761B; --h5s:#E6F0D2; --h6:#7345C7; --h6s:#EAE1F8;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424; --surface:#151F38; --ink:#E7ECF7; --muted:#9CA9C6; --line:#293557; --soft:#1C2848;
    --brand:#8CA6F7; --on-brand:#0D1424; --ok:#4FD1A5; --ok-soft:#12372E; --warn:#F2B14C; --warn-soft:#3B2C12; --bad:#FF8F85; --bad-soft:#41191A;
    --h1:#8FA8FF; --h1s:#1B2750; --h2:#4FD0BF; --h2s:#11352F; --h3:#F2A65E; --h3s:#3A2A14;
    --h4:#F08DB6; --h4s:#3E1A2D; --h5:#A6CB5E; --h5s:#27341A; --h6:#BA98F5; --h6s:#2D2150;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424; --surface:#151F38; --ink:#E7ECF7; --muted:#9CA9C6; --line:#293557; --soft:#1C2848;
  --brand:#8CA6F7; --on-brand:#0D1424; --ok:#4FD1A5; --ok-soft:#12372E; --warn:#F2B14C; --warn-soft:#3B2C12; --bad:#FF8F85; --bad-soft:#41191A;
  --h1:#8FA8FF; --h1s:#1B2750; --h2:#4FD0BF; --h2s:#11352F; --h3:#F2A65E; --h3s:#3A2A14;
  --h4:#F08DB6; --h4s:#3E1A2D; --h5:#A6CB5E; --h5s:#27341A; --h6:#BA98F5; --h6s:#2D2150;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1180px;margin:0 auto;padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.sm{font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-size:1.15rem;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.1}
.mark{flex:none}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.snav{display:flex;gap:4px;flex-wrap:wrap}
.navlink{font:600 .92rem var(--body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 10px;cursor:pointer;min-height:40px}
.navlink:hover{color:var(--ink)}
.navlink[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}

/* buttons + fields */
.btn{font:600 .95rem/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:9px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--brand)}
.btn:focus-visible,.opt:focus-visible,.qn:focus-visible,.tab:focus-visible,.navlink:focus-visible,.ccard:focus-visible,.namelink:focus-visible,.sc:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:7px 11px;min-height:34px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:grid;gap:6px;font-weight:600;font-size:.9rem}
label.f span.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=password],input[type=number],select,textarea{font:400 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%;min-height:44px}
select:disabled{opacity:.55}
textarea{min-height:140px;font-family:var(--mono);font-size:.88rem;line-height:1.5;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:9px;align-items:flex-start;font-weight:400;font-size:.92rem}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--brand)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.card.tight{padding:16px}
.err{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);padding:10px 12px;border-radius:9px;font-weight:600;font-size:.92rem}
.note{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);padding:10px 12px;border-radius:9px;font-size:.9rem}
.okbox{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);padding:10px 12px;border-radius:9px;font-size:.92rem;font-weight:600}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

/* candidate home */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
.home .lead{display:grid;gap:8px;margin-bottom:18px}
.form{display:grid;gap:14px}
.guide{display:grid;gap:14px}
.guide dl{margin:0;display:grid;gap:12px}
.guide dt{font-weight:700}
.guide dd{margin:0;color:var(--muted);font-size:.93rem}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:grid;gap:8px;justify-items:center}
.empty b{color:var(--ink)}

/* intro */
.intro{max-width:720px;margin:0 auto;display:grid;gap:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:10px;padding:12px 14px}
.fact b{display:block;font-family:var(--mono);font-size:1.4rem}
.fact span{font-size:.8rem;color:var(--muted)}
.rules{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}

/* exam */
.examtop{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center}
.examtop .who{min-width:0}
.examtop .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.examtop .who span{color:var(--muted);font-size:.82rem}
.timer{font-family:var(--mono);font-weight:600;font-size:1.25rem;padding:7px 14px;border-radius:9px;background:var(--soft);min-width:96px;text-align:center}
.timer.warn{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--bad-soft);color:var(--bad)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qsec{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
.qtext{font-size:1.2rem;line-height:1.5;margin:6px 0 20px;max-width:65ch;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;font:400 1.05rem/1.4 var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;min-height:56px}
.opt:hover{border-color:var(--brand)}
.opt .let{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--soft);font-family:var(--mono);font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--soft)}
.opt[aria-pressed="true"] .let{background:var(--brand);color:var(--on-brand)}
.opt.multi .let{border-radius:50%}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend i.a{background:var(--brand);border-color:var(--brand)}
.legend i.f{background:var(--warn);border-color:var(--warn)}
.navsec{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.qn{position:relative;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--mono);cursor:pointer}
.qn.a{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.qn.cur{outline:2.5px solid var(--ink);outline-offset:2px}
.qn.fl::after{content:"";position:absolute;top:-1px;right:-1px;width:0;height:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--warn) transparent transparent;border-top-right-radius:8px}
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.6);display:grid;place-items:center;padding:20px;z-index:40}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:460px;width:100%;display:grid;gap:14px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tally div{background:var(--bg);border-radius:10px;padding:10px}
.tally b{display:block;font:600 1.4rem var(--mono)}
.tally span{font-size:.78rem;color:var(--muted)}

/* candidate result */
.result{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.big{font-family:var(--mono);font-weight:600;font-size:clamp(2.6rem,8vw,4rem);line-height:1}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac,var(--brand))}
.fibs{display:grid;gap:12px;margin:0 0 18px;max-width:520px}
.theoryin{font-family:var(--body)!important;font-size:1.05rem!important;min-height:220px;line-height:1.55}
label.f .theoryin{margin-top:2px}
.markbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.markbox input[type=number]{width:96px}
.hit{padding:1px 4px;border-radius:5px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.hit.near{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.chip.full{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.near{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.mkq{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.mkq.adj{border-left:4px solid var(--warn)}
.ans-box{background:var(--bg);border-radius:9px;padding:10px 12px;white-space:pre-wrap;font-size:.95rem}
.hist{font-size:.82rem;color:var(--muted);display:grid;gap:2px}
.prov-badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.review{display:grid;gap:12px;margin-top:6px}
.rv{border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.rv.good{border-left:4px solid var(--ok)}
.rv.miss{border-left:4px solid var(--bad)}
.rv p{font-size:.92rem}

/* examiner: shared */
.stack{display:grid;gap:16px}
.page-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.page-head p{max-width:60ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:600 .92rem var(--body);padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ac,var(--brand));border-color:var(--ac,var(--brand));color:var(--on-brand)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
th small{display:block;font-weight:600;letter-spacing:0;text-transform:none;font-family:var(--mono)}
td.num,th.num{text-align:right}
.drop{display:grid;place-items:center;text-align:center;gap:4px;padding:24px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--muted)}
.drop:hover,.drop.over{border-color:var(--brand);color:var(--ink)}
.drop b{color:var(--ink)}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.qlist{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none;max-height:360px;overflow:auto}
.qlist li{background:var(--bg);border-radius:9px;padding:10px 12px;font-size:.92rem}
.qlist .o{display:block;color:var(--muted);padding-left:4px}
.qlist .o.c{color:var(--ok);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:.92rem;z-index:50;max-width:min(520px,calc(100vw - 32px));text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.28)}
.syncline{margin:0;font-size:.92rem;font-weight:600}
.syncline.ok{color:var(--ok)}
.syncline.wait{color:var(--muted)}
.syncline.warn{color:var(--bad,#b3261e)}
.info{background:var(--soft);color:var(--muted);border:1px solid var(--line);padding:10px 12px;border-radius:9px;font-size:.88rem}
.info summary{cursor:pointer;font-weight:600;color:var(--ink)}
.info ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}

/* class cards */
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ccard{display:grid;grid-template-rows:auto 1fr;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;padding:0}
.ccard:hover{border-color:var(--ac)}
.ccard .band{display:block;height:44px;background:var(--acs);border-bottom:1px solid var(--line)}
.ccard .in{display:grid;gap:12px;padding:16px 18px 18px}
.ctitle{font:700 1.4rem/1.1 var(--display);letter-spacing:-.01em;margin-top:-34px;display:block;padding:3px 0}
.ctitle span{background:var(--surface);padding:3px 10px;border-radius:8px;border:1px solid var(--line);display:inline-block}
.nums{display:flex;gap:20px;flex-wrap:wrap}
.nums b{display:block;font:600 1.5rem/1.1 var(--mono);color:var(--ac)}
.nums small{color:var(--muted);font-size:.78rem}
.cls-top{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--acs);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.cls-top h1{font-size:clamp(1.6rem,3.5vw,2.2rem)}
.cls-top .nums b{color:var(--ink)}
.cls-top .grow{flex:1 1 220px;min-width:0}
.hue{display:flex;gap:8px;flex-wrap:wrap}
.hue button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.hue button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}

/* register */
.reg th:first-child,.reg td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.reg tbody tr:hover td{background:var(--soft)}
.reg tbody tr:hover td:first-child{background:var(--soft)}
.reg tfoot td{font-weight:600;border-top:2px solid var(--line);color:var(--muted)}
.namelink{font:600 .95rem var(--body);background:none;border:0;padding:4px 0;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.namelink:hover{text-decoration-color:var(--ac)}
.sc{font:600 .85rem var(--mono);border:0;border-radius:7px;padding:4px 8px;cursor:pointer;display:inline-block;min-width:58px;text-align:center}
.sc.ok{background:var(--ok-soft);color:var(--ok)}
.sc.bad{background:var(--bad-soft);color:var(--bad)}
.sc.none{background:none;color:var(--muted);cursor:default;font-weight:400}

/* child page */
.child-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile b{display:block;font:600 1.8rem/1.1 var(--mono);color:var(--ac)}
.tile span{font-size:.8rem;color:var(--muted)}

/* analysis */
.spread{display:grid;gap:6px}
.spread div{display:grid;grid-template-columns:64px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:.85rem}
.spread .t{height:14px;border-radius:5px;background:var(--soft);overflow:hidden}
.spread .t i{display:block;height:100%;background:var(--ac)}
.qa{display:grid;gap:10px}
.qa .r{display:grid;grid-template-columns:34px minmax(0,1fr) 150px 72px;gap:12px;align-items:center;font-size:.9rem;padding:8px 0;border-bottom:1px solid var(--line)}
.qa .r .q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.qa .r .t{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.qa .r .t i{display:block;height:100%;background:var(--ac)}
.qa .r.flag .t i{background:var(--bad)}

@media (max-width:900px){
  .home,.result,.desk{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .examtop{grid-template-columns:minmax(0,1fr) auto}
  .examtop .who{grid-column:1 / -1}

<script id="xd-code">
(async function(){
'use strict';

/*PURE-START*/
const LABEL=/^\(?([A-Ha-h])[\.\)]\s+/;
const BULLET=/^[-*•]\s+/;
const NUMQ=/^\(?\d{1,3}[\.\)](?=\s|[A-Za-z])\s*/;
const CORRECT_T=/\[\s*correct\s*\]/i;
const CORRECT_G=/\s*\[\s*correct\s*\]\s*/ig;

/* ---- written questions: markers, marks and matching (stage 2) ---- */
const NOTE_L=/^(note|guide|tip)\s*:/i;
const ANS_LINE=/^answers?\s*(\d{1,2})?\s*[:\-]\s*(.+)$/i;
const RUB_LINE=/^rubric\s*[:\-]\s*(.*)$/i;
const Q_MARKS=/\s*[\[\(]\s*(\d+(?:\.\d+)?)\s*marks?\s*[\]\)]\s*$/i;
const SEC_MARKS=/(?:\||\(|\[)\s*(\d+(?:\.\d+)?)\s*marks?(?:\s*(?:each|per\s*question))?\s*[\)\]]?\s*$/i;
const SUBQ=/^\(?(\d{1,3})\s?([a-z])[\.\)]\s+/i;
const r2=x=>Math.round(x*100)/100;
function parseSecLine(t){
  const m=SEC_MARKS.exec(t);
  if(!m)return {name:t.trim(),marks:null,each:null};
  const each=/each|per\s*question/i.test(m[0]);
  return {name:t.slice(0,m.index).replace(/[\s\-\u2013\u2014|:(\[]+$/,'').trim()||t.trim(),marks:each?null:parseFloat(m[1]),each:each?parseFloat(m[1]):null};
}
const splitAlts=s=>String(s).split('|').map(x=>x.trim()).filter(Boolean);
function parseRubric(s){
  return String(s||'').split('|').map(x=>x.trim()).filter(Boolean).map(x=>{
    let m=null;const mm=/\(\s*(\d+(?:\.\d+)?)\s*(?:marks?)?\s*\)\s*$/i.exec(x);
    if(mm){m=parseFloat(mm[1]);x=x.slice(0,mm.index).trim();}
    return {kw:x.split('/').map(y=>y.trim()).filter(Boolean),m};
  }).filter(r=>r.kw.length);
}
const qType=q=>q.type||'obj';
function qMarkable(q){const t=qType(q);if(q.hk)return true;return t==='fib'?!!(q.answers&&q.answers.length):t==='theory'?true:q.options.some(o=>o.c);}
const qMax=q=>q.marks!=null?q.marks:(qMarkable(q)?1:0);
const blanksOf=q=>Math.max(1,(q.answers||[]).length);
function resolveMarks(e,warnings){
  const qs=e.questions,secs=e.secs||{},order=[];
  qs.forEach(q=>{if(!order.includes(q.section))order.push(q.section);});
  order.forEach(name=>{
    const g=qs.filter(q=>q.section===name),info=secs[name]||null;
    const mk=g.filter(qMarkable);
    g.filter(q=>!qMarkable(q)).forEach(q=>{q.marks=0;});
    const fixed=mk.filter(q=>q.qm!=null);fixed.forEach(q=>{q.marks=q.qm;});
    const free=mk.filter(q=>q.qm==null);
    const fsum=fixed.reduce((a,q)=>a+q.qm,0);

      if(info&&info.marks!=null&&Math.abs(fsum-info.marks)>0.001)warnings.push('Section \u201c'+name+'\u201d says '+info.marks+' marks but its questions add up to '+r2(fsum)+'.');

    if(info&&info.marks!=null){

      free.forEach(q=>{const u=units[units.length-1];if(q.no&&u&&u.no===q.no)u.qs.push(q);else units.push({no:q.no,qs:[q]});});

    const t=qType(q),lab='Question '+(q.no?q.no+(q.sub||''):(i+1));

      const nb=(String(q.text).match(/_{2,}/g)||[]).length;
      if(nb&&nb!==q.answers.length)warnings.push(lab+': '+nb+' blank'+(nb>1?'s':'')+' but '+q.answers.length+' answer line'+(q.answers.length>1?'s':'')+'.');
    }
    if(t==='theory'){
      if(!q.rubric.length)warnings.push(lab+': no keywords in the rubric, so it will be marked by hand.');

}
function splitInline(t){
  const re=/(^|\s)\(?([A-Ha-h])[\.\)]\s+/g;

  while((m=re.exec(t))!==null){marks.push({start:m.index+m[1].length,end:m.index+m[0].length,L:m[2].toLowerCase()});}
  if(marks.length<2||marks[0].L!=='a')return null;
  for(let i=0;i<marks.length;i++)if(marks[i].L!==String.fromCharCode(97+i))return null;
  return {pre:t.slice(0,marks[0].start).trim(),opts:marks.map((mk,i)=>t.slice(mk.end,i+1<marks.length?marks[i+1].start:t.length).trim())};
}
function structOpt(p){
  if(p.kind!=='p')return false;
  if(p.list&&(p.list.fmt==='letter'||p.list.fmt==='bullet'||p.list.lvl>0))return true;
  return LABEL.test(p.text)||BULLET.test(p.text);

  let h1='',h2='',sec='',cur=null,q=null,prev=null,prevRole='',secInfo={};
  const ensure=()=>{
    const key=h1+'\u0001'+h2;
    if(!cur||cur.key!==key){cur={key,title:h1||'Untitled test',course:h2,questions:[],secs:{}};exams.push(cur);}
  };

    ensure();

    const mm=Q_MARKS.exec(t);if(mm){qm=parseFloat(mm[1]);t=t.slice(0,mm.index).trim();}
    const sq=SUBQ.exec(t);

    if(sec&&secInfo[sec])cur.secs[sec]=secInfo[sec];

  };
  const addO=text=>{
    if(!q){ignored.push(text);return;}
    const c=CORRECT_T.test(text);

  };

  const runLen=i=>{
    const p=ps[i];let n=0;
    for(let j=i;j<ps.length;j++){const x=ps[j];if(x.kind==='p'&&x.list&&x.list.fmt==='decimal'&&x.list.numId===p.list.numId&&x.list.lvl===p.list.lvl)n++;else break;}
    return n;
  };

    const p=ps[i];
    if(p.kind==='p'&&NOTE_L.test(p.text))continue;
    if(p.kind==='h1'){h1=p.text;h2='';sec='';cur=null;q=null;prev=null;prevRole='';secInfo={};continue;}
    if(p.kind==='h2'){h2=p.text;sec='';cur=null;q=null;prev=null;prevRole='';continue;}
    if(p.kind==='h3'){const sp=parseSecLine(p.text);sec=sp.name;secInfo[sec]=sp;q=null;prev=null;prevRole='';continue;}
    if(p.kind==='p'){
      const mA=ANS_LINE.exec(p.text),mR=RUB_LINE.exec(p.text);

        if(!q||q.options.length){ignored.push(p.text);continue;}

        else{q.type='theory';q.rubric=parseRubric(mR[1]);}
        prev=p;prevRole='m';continue;
      }
    }
    const inl=splitInline(p.text.replace(NUMQ,''));
    if(inl&&inl.pre){addQ(inl.pre);inl.opts.forEach(addO);prev=p;prevRole='q';continue;}

    if(explicitOpt(p))role='opt';
    else if(p.list&&p.list.fmt==='decimal'){
      const nx=nextP(i);
      if(prevRole==='m')role='q';
      else if(nx&&(ANS_LINE.test(nx.text)||RUB_LINE.test(nx.text)))role='q';
      else if(nx&&structOpt(nx))role='q';

    if(e.questions.length)out.push(e);
  });

    e.questions.forEach((qq,i)=>{

}

function parseText(raw){
  const paras=String(raw).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    if(/^###\s+/.test(l))return {kind:'h3',text:l.replace(/^###\s+/,''),list:null};
    if(/^##\s+/.test(l))return {kind:'h2',text:l.replace(/^##\s+/,''),list:null};
    if(/^#\s+/.test(l))return {kind:'h1',text:l.replace(/^#\s+/,''),list:null};
    return {kind:'p',text:l,list:null};
  });

}

function scoreOf(questions,ans){
  let score=0,total=0;
  questions.forEach((q,i)=>{
    const cor=q.options.map((o,k)=>o.c?k:-1).filter(k=>k>=0);
    if(!cor.length)return;
    total++;
    const a=(ans[i]||[]).slice().sort((x,y)=>x-y);
    if(a.length===cor.length&&a.every((v,j)=>v===cor[j]))score++;
  });
  return {score,total};
}

/* ---- answer matching and marking (stage 2) ---- */
const NEAR=0.5;                                   // a one-letter slip in a longer word earns half marks
const normAns=s=>String(s==null?'':s).toLowerCase().replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/^["']+/,'').replace(/["'.,;:!?]+$/,'').trim();
function asNum(s){
  const t=String(s).trim().replace(/^[₦$£€]\s*/,'').replace(/(\d),(?=\d{3}(\D|$))/g,'$1').replace(/\s+/g,'');

function near1(a,b){                                // one letter wrong, missing, extra or two neighbours swapped

const normText=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9À-ɏ]+/g,' ').trim();
function kwMatch(tokens,alts){
  let best={state:'no',found:''};

    const a=normText(a0);if(!a)continue;
    const n=a.split(' ').length;
    for(let i=0;i+n<=tokens.length;i++){
      const w=tokens.slice(i,i+n).join(' ');

function rubricMarks(q){

function markExam(ex,ans,txt,mk,only){

function gradeOf(pct){return pct>=70?'A':pct>=60?'B':pct>=50?'C':pct>=45?'D':pct>=40?'E':'F';}
function csvCell(v){const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}

const nk=s=>String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();

const HASL=/[A-Za-zÀ-ɏ]/;

function uniqueNames(list){
  const cnt=new Map(),taken=new Set(),out=[],renamed=[];
  list.forEach(n=>{

function rosterFromRows(rows){

  const lim=Math.min(rows.length,12);

    let c=-1,s=-1;const g=[];

const fmtKind=v=>/letter|roman/i.test(v||'')?'letter':(/^(bullet|none)$/i.test(v||'')?'bullet':'decimal');
function stylesMap(xml){
  const d=new DOMParser().parseFromString(xml,'application/xml');
  const map={};
  for(const st of d.getElementsByTagNameNS(WNS,'style')){
    const id=st.getAttributeNS(WNS,'styleId');
    const bo=st.getElementsByTagNameNS(WNS,'basedOn')[0],np=st.getElementsByTagNameNS(WNS,'numPr')[0],nm=st.getElementsByTagNameNS(WNS,'name')[0];
    let numId='',ilvl='';
    if(np){const ni=np.getElementsByTagNameNS(WNS,'numId')[0],il=np.getElementsByTagNameNS(WNS,'ilvl')[0];if(ni)numId=ni.getAttributeNS(WNS,'val')||'';if(il)ilvl=il.getAttributeNS(WNS,'val')||'';}
    map[id]={numId,ilvl,basedOn:bo?bo.getAttributeNS(WNS,'val')||'':'',name:nm?nm.getAttributeNS(WNS,'val')||id:id};
  }

function styleNum(map,id,depth){
  const s=map[id];depth=depth||0;
  if(!s||depth>8)return {numId:'',ilvl:''};

function extractParas(docXml,numXml,stylesXml){
  const nums=numXml?numMap(numXml):{};
  const styles=stylesXml?stylesMap(stylesXml):{};
  const d=new DOMParser().parseFromString(docXml,'application/xml');
  const out=[];
  const walk=(n,acc)=>{
    for(const c of n.childNodes){
      if(c.nodeType!==1)continue;
      const ln=c.localName;
      if(ln==='t')acc.s+=c.textContent;
      else if(ln==='tab'||ln==='br')acc.s+=' ';
      else if(ln!=='pPr'&&ln!=='delText')walk(c,acc);
    }
  };
  for(const p of d.getElementsByTagNameNS(WNS,'p')){
    const acc={s:''};walk(p,acc);
    let pPr=null;for(const c of p.childNodes){if(c.nodeType===1&&c.localName==='pPr'){pPr=c;break;}}
    let style='',numId='',ilvl='';
    if(pPr){
      const ps=pPr.getElementsByTagNameNS(WNS,'pStyle')[0];if(ps)style=ps.getAttributeNS(WNS,'val')||'';
      const np=pPr.getElementsByTagNameNS(WNS,'numPr')[0];
      if(np){
        const ni=np.getElementsByTagNameNS(WNS,'numId')[0],il=np.getElementsByTagNameNS(WNS,'ilvl')[0];
        if(ni)numId=ni.getAttributeNS(WNS,'val')||'';
        if(il)ilvl=il.getAttributeNS(WNS,'val')||'';
      }
    }
    const sname=(styles[style]&&styles[style].name)||style;
    let kind='p';
    if(/^heading\s*1$/i.test(style)||/^heading\s*1$/i.test(sname))kind='h1';
    else if(/^heading\s*2$/i.test(style)||/^heading\s*2$/i.test(sname))kind='h2';
    else if(/^heading\s*3$/i.test(style)||/^heading\s*3$/i.test(sname))kind='h3';
    let list=null;
    if(kind==='p'){
      if(!numId&&style){const sn=styleNum(styles,style);numId=sn.numId;if(!ilvl)ilvl=sn.ilvl;}
      if(numId&&numId!=='0'){
        const lv=ilvl||'0',f=(nums[numId]||{})[lv];
        list={fmt:fmtKind(f),lvl:parseInt(lv,10)||0,numId};
      }else if(!numId&&/^list\s*bullet/i.test(sname))list={fmt:'bullet',lvl:0,numId:'sb'};
      else if(!numId&&/^list\s*number/i.test(sname))list={fmt:'decimal',lvl:0,numId:'sn'};
    }
    out.push({kind,text:acc.s,list});
  }
  return out;
}

  if(!cur){(MK[rid]=MK[rid]||{})[qi]={m:rec.m,by:rec.by,at:rec.at,h:(rec.h||[]).slice()};return true;}
  const win=cur.at>=rec.at?cur:rec,seen=new Set(),all=[];
  (cur.h||[]).concat(rec.h||[]).forEach(h=>{const k=hk(h);if(!seen.has(k)){seen.add(k);all.push(h);}});

      const j=await r.json().catch(()=>null);

      if(!r.ok||!j||!j.ok){if(j&&/^licence_/.test(j.error||''))S.st.note='Marks are kept on this device. The server is not taking changes because of the licence ('+j.error.replace('licence_','')+').';break;}
      (j.accepted||[]).forEach(k=>MQ.delete(k));
      (j.rejected||[]).forEach(x=>{if(x&&x.key)MQ.delete(x.key);});
    }
  }catch(e){}
  finally{flushingM=false;saveMK();}
}
async function pullMarks(manual){
  const h2=ses.get(K_H2);
  if(!SA||!SRVS.on||!h2||pullingM)return;
  pullingM=true;
  try{
    let since=store.get(K_MPULL)||0,changed=0,guard=0;
    while(guard++<40){
      const r=await srvFetch('/api/marks?since='+since,{headers:authHdr()});
      if(r.status===401){ses.del(K_H2);break;}
      const j=await r.json().catch(()=>null);
      if(!j||!j.ok)break;
      j.marks.forEach(x=>{if(x&&x.rid&&mergeMark(x.rid,x.qi,x.rec)){changed++;}});
      since=j.upTo;store.set(K_MPULL,since);
      if(!j.more)break;
    }
    if(changed){saveMK();reindex();}
    if(changed&&S.view==='staff')render();
  }catch(e){}
  finally{pullingM=false;}
}

/* ---------- exam logic ---------- */
function curQ(){const s=S.ses;const e=s.qs[s.idx];return {e,q:s.exam.questions[e.i]};}
function isMulti(q){return !!q.multi||q.options.filter(o=>o.c).length>1;}
function persist(){store.set(K_SES,S.ses);}
function startExam(){
  if(switchedOff()){toast('This school’s ExamDesk is switched off. Please tell your teacher.');return;}
  const c=cls(S.cand.cid);
  const ex=c.exams.find(e=>e.id===S.form.eid);
  const exam=clone(ex);
  const groups=[];
  candIdx(exam).forEach(i=>{
    const q=exam.questions[i],g=groups[groups.length-1];
    if(g&&g.sec===q.section)g.ix.push(i);else groups.push({sec:q.section,ix:[i]});
  });
  let order=[];
  groups.forEach(g=>{
    let ix=g.ix;const k=exam.draw&&exam.draw[g.sec||''];
    if(k){const us=secUnits(exam,g.sec||'').map(u=>u.ix.filter(i=>ix.includes(i))).filter(u=>u.length);
      if(k<us.length)ix=shuffle(us.slice()).slice(0,k).reduce((a,u)=>a.concat(u),[]).sort((a,b)=>a-b);}
    order=order.concat(exam.shuffleQ?shuffle(ix):ix);});
  const qs=order.map(i=>{
    const n=exam.questions[i].options.length,base=[...Array(n).keys()];
    return {i,perm:exam.shuffleO?shuffle(base):base};
  });
  const now=Date.now();
  S.ses={cid:c.id,cname:c.name,name:S.cand.name,exam,qs,ans:{},txt:{},flags:{},idx:0,startedAt:now,endsAt:now+exam.duration*60000};
  persist();S.view='exam';S.confirmSubmit=false;render();
}
function finish(auto){
  const s=S.ses;if(!s)return;
  const ans={},txt={};
  s.qs.forEach((e,p)=>{
    if(s.ans[p])ans[e.i]=s.ans[p];
    const v=s.txt&&s.txt[p];
    if(v!=null&&(Array.isArray(v)?v.some(x=>String(x||'').trim()):String(v).trim()))txt[e.i]=v;
  });
  const hk=!!s.exam.hk;
  const m=hk?{score:0,total:examTotal(s.exam),pct:0,grade:'-',pass:false,prov:true,cbt:0,parts:[]}:markExam(s.exam,ans,txt,null,s.exam.draw?s.qs.map(e=>e.i):null);
  const ok=hk?'':okOf(s.exam,m);
  const now=Date.now();
  const r={id:uid(),cid:s.cid,name:s.name,eid:s.exam.id,subject:s.exam.subject,title:s.exam.title,
    score:m.score,total:m.total,pct:m.pct,grade:m.grade,pass:m.pass,passMark:s.exam.passMark,
    startedAt:s.startedAt,submittedAt:now,usedSec:Math.min(Math.round((now-s.startedAt)/1000),s.exam.duration*60),auto:!!auto,
    ans,txt,ok,sig:hk?sigN(s.exam):sigOf(s.exam),prov:m.prov,cbt:m.cbt,ord:s.qs.map(e=>e.i)};
  if(hk)r.hk=1;
  if(s.integ){if(s.integ.since){s.integ.n=(s.integ.n||0)+1;s.integ.secs=(s.integ.secs||0)+Math.round((Date.now()-s.integ.since)/1000);delete s.integ.since;}r.integ={n:s.integ.n||0,secs:s.integ.secs||0,off:s.integ.off||0};}
  if(s.exam.shuffleO){const pm={};s.qs.forEach(e=>{if(e.perm.some((v,k)=>v!==k))pm[e.i]=e.perm;});if(Object.keys(pm).length)r.perm=pm;}
  const tk=tokFor(s.cid);if(tk)r.tok=tk;
  R.push(r);saveR();store.del(K_SES);
  stopTimer();
  if(SA)setTimeout(flushResults,50);
  S.res=Object.assign({},r,{questions:s.exam.questions,ord:s.qs.map(e=>e.i),showResult:hk?false:s.exam.showResult,showReview:hk?false:s.exam.showReview,cname:s.cname,mexam:s.exam});
  S.ses=null;S.view='result';S.confirmSubmit=false;render();
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function startTimer(){
  if(timerId)return;
  const tick=()=>{
    if(!S.ses){stopTimer();return;}
    const left=(S.ses.endsAt-Date.now())/1000;
    const el=document.getElementById('timer');
    if(el){el.textContent=fmtClock(left);el.className='timer'+(left<=60?' crit':left<=300?' warn':'');}
    if(left<=0){finish(true);}
  };
  tick();timerId=setInterval(tick,1000);
}

      if(t==='fib'){
        const given=(r.txt&&r.txt[qi])||[],ok=pt.got>=pt.max;
        return '<div class="rv '+(ok?'good':'miss')+'"><p>'+lab+esc(q.text)+mk+'</p><p class="muted">Your answer: '+(given.some(x=>String(x||'').trim())?esc(given.map(x=>x||'–').join('; ')):'no answer')+'</p>'+(ok?'':'<p style="color:var(--ok);font-weight:600">Correct: '+esc(q.answers.map(a=>a[0]).join('; '))+'</p>')+'</div>';
      }
      if(t==='theory'){
        const v=String((r.txt&&r.txt[qi])||'').trim();
        return '<div class="rv"><p>'+lab+esc(q.text)+' <span class="muted sm">('+fmtN(pt.max)+' marks)</span></p><div class="ans-box">'+(v?esc(v):'<span class="muted">No answer</span>')+'</div><p class="muted sm">Your teacher will mark this.</p></div>';
      }
      const cor=q.options.map((o,k)=>o.c?k:-1).filter(k=>k>=0),a=(r.ans[qi]||[]).slice().sort((x,y)=>x-y);
      const ok=a.length===cor.length&&a.every((v,j)=>v===cor[j]);
      return '<div class="rv '+(ok?'good':'miss')+'"><p>'+lab+esc(q.text)+mk+'</p><p class="muted">Your answer: '+(a.length?esc(a.map(k=>q.options[k].t).join('; ')):'no answer')+'</p>'+(ok?'':'<p style="color:var(--ok);font-weight:600">Correct: '+esc(cor.map(k=>q.options[k].t).join('; '))+'</p>')+'</div>';
    }).join('')+'</div></section>':'';
    body='<div class="result"><section class="card" style="display:grid;gap:16px"><span class="eyebrow">'+esc(r.title)+' · '+esc(r.subject)+'</span>'+
    '<div class="big">'+fmtN(r.score)+'<span class="muted" style="font-size:.45em"> / '+fmtN(r.total)+'</span></div>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+r.pct+'%"></i></div>'+
    (prov?'<div class="row"><span class="prov-badge">Provisional</span><span class="mono">'+r.pct+'%</span></div>'+
      '<div class="note"><b>This score is not final.</b> It counts only what the computer could mark'+(thMax?': '+fmtN(r.cbt!=null?r.cbt:r.score)+' out of '+fmtN(cbtMax)+' marks.':'.')+' Your teacher still has to mark the written answers'+(thMax?' ('+fmtN(thMax)+' marks)':'')+', and your final score will change.</div>'
      :'<div class="row"><span class="badge '+(r.pass?'ok':'bad')+'">'+(r.pass?'Pass':'Below pass mark')+'</span><span class="mono">'+r.pct+'%</span><span class="badge">Grade '+r.grade+'</span></div>')+
    '<p class="muted">'+esc(r.name)+' · '+esc(r.cname||'')+'<br>Time used '+fmtClock(r.usedSec)+(r.auto?' (submitted automatically when time ran out)':'')+'</p>'+syncLine(r)+
    '<div><button class="btn primary" data-act="done">Finish</button></div></section>'+(rv||'<div></div>')+'</div>';
  }
  return topBar('')+body;
}

const rcR1=v=>Math.round(v*10)/10;
/* the numbers on one child's card */
function rcData(c,name,kind){
  const cf=rcCfg(),mids=c.exams.filter(e=>e.term==='mid'),ends=c.exams.filter(e=>e.term==='end');
  const wMid=kind==='mid'?cf.wMid:(mids.length?cf.wMid:0),wEnd=kind==='mid'?0:(mids.length?cf.wEnd:100);
  const subs=[];
  (kind==='mid'?mids:mids.concat(ends)).forEach(e=>{if(!subs.some(x=>nk(x)===nk(e.subject)))subs.push(e.subject);});
  const part=(list,w)=>{if(!w||!list.length)return {v:undefined};
    const rs=list.map(e=>resFor(c.id,name,e.id)).filter(Boolean);
    if(rs.length<list.length)return {v:null};
    const sc=rs.reduce((a,r)=>a+r.score,0),to=rs.reduce((a,r)=>a+r.total,0);
    return {v:to?rcR1(sc/to*w):0,prov:rs.some(r=>r.prov)};};
  const rows=subs.map(sj=>{
    const m=part(mids.filter(e=>nk(e.subject)===nk(sj)),wMid),en=part(ends.filter(e=>nk(e.subject)===nk(sj)),wEnd);
    const need=[wMid&&mids.some(e=>nk(e.subject)===nk(sj)),wEnd&&ends.some(e=>nk(e.subject)===nk(sj))].filter(Boolean).length;
    const got=[m.v,en.v].filter(v=>typeof v==='number');
    const tot=got.length&&got.length===Math.max(need,1)?rcR1(got.reduce((a,b)=>a+b,0)):null;
    return {subject:sj,mid:m.v,end:en.v,tot,prov:!!(m.prov||en.prov)};});
  const complete=rows.length>0&&rows.every(r=>r.tot!=null);
  const per=wMid+wEnd,obt=rows.length*per,total=complete?rcR1(rows.reduce((a,r)=>a+r.tot,0)):null;
  return {rows,wMid,wEnd,complete,obt,total,avg:complete&&obt?rcR1(total/obt*100):null,prov:rows.some(r=>r.prov),missing:rows.filter(r=>r.tot==null).length};
}
function rcPosition(c,name,kind){
  const all=c.roster.map(n=>({n,d:rcData(c,n,kind)})).filter(x=>x.d.complete).sort((a,b)=>b.d.total-a.d.total);
  let rank=0,prev=null,seen=0,mine=0;
  all.forEach(x=>{seen++;if(x.d.total!==prev){rank=seen;prev=x.d.total;}if(nk(x.n)===nk(name))mine=rank;});
  return mine?{rank:mine,of:all.length}:null;
}

const AS_CSS="@page{size:A4;margin:14mm}*{box-sizing:border-box}body{margin:0;font:12px/1.4 'Times New Roman',Times,serif;color:#111}.sc{page-break-after:always}.sc:last-child{page-break-after:auto}header{text-align:center}header img{max-height:18mm;max-width:40mm}h1{margin:2px 0;font-size:20px;text-transform:uppercase}.ad{font-size:11px;margin:0 0 6px}h2{text-align:center;margin:8px 0;font-size:14px;text-transform:uppercase}.id{display:flex;flex-wrap:wrap;gap:4px 22px;border-top:1.5px solid #111;border-bottom:1.5px solid #111;padding:5px 0;margin:6px 0 8px;font-weight:700}.sum{display:flex;gap:18px;flex-wrap:wrap;border:1.5px solid #111;padding:5px 10px;margin-bottom:8px;font-weight:700}.sh{font-weight:700;text-transform:uppercase;margin:12px 0 4px;border-bottom:1px solid #111;display:flex;justify-content:space-between}.q{margin:7px 0;page-break-inside:avoid}.q p{margin:0 0 2px;white-space:pre-line}.mk{float:right;font-weight:700;margin-left:10px;white-space:nowrap}.mk.g{color:#1a7a35}.mk.b{color:#b3261e}.opts{display:flex;flex-wrap:wrap;gap:1px 18px;margin:2px 0 0 18px}.opts span{white-space:nowrap}.pick{font-weight:700;text-decoration:underline}.right{color:#1a7a35;font-weight:700}.wrong{color:#b3261e}.ans{margin:2px 0 0 18px}.box{border:1px solid #888;padding:4px 7px;margin:3px 0 0 18px;white-space:pre-wrap;min-height:18px}.cor{margin:2px 0 0 18px;color:#1a7a35;font-weight:700}.note{font-size:10.5px;margin-top:8px}";
/* ---------- blank question paper (for pupils who write on paper); the teacher's copy marks the right answers ---------- */
function bpDoc(c,eid,key){
  const ex=c.exams.find(e=>e.id===eid);if(!ex)return '';
  const cf=rcCfg(),E=esc,L='abcdefghijklmnopqrstuvwxyz';
  const m=markExam(ex,{},{},null);m.total=examTotal(ex);
  const head='<header>'+(cf.logo?'<img src="'+E(cf.logo)+'" alt="">':'')+'<h1>'+E(W.school||'School name')+'</h1>'+(cf.addr?'<p class="ad">'+E(cf.addr)+'</p>':'')+'</header>'+
    '<h2>'+E([cf.termName,ex.title].filter(Boolean).join(' — '))+(cf.year?' ('+E(cf.year)+')':'')+(key?' — TEACHER’S COPY':'')+'</h2>'+
    '<div class="id"><span>NAME: '+(key?'':'__________________________')+'</span><span>CLASS: '+E(c.name.toUpperCase())+'</span><span>SUBJECT: '+E(String(ex.subject||'').toUpperCase())+'</span><span>DATE: '+(key?'':'__________')+'</span></div>'+
    '<div class="sum"><span>TIME: '+ex.duration+' minutes</span><span>TOTAL MARKS: '+fmtN(m.total)+'</span></div>';
  let out='',sec=null,num=0;
  ex.questions.forEach((q,qi)=>{
    if(q.section!==sec){sec=q.section;const sm=m.secs.find(x=>x.name===(sec||''));out+='<div class="sh"><span>'+E(sec||'')+'</span>'+(sm&&sm.max?'<span>'+fmtN(sm.max)+' marks</span>':'')+'</div>';}
    num++;
    const t=qType(q),mx=qMax(q),mk=mx?'<span class="mk">('+fmtN(mx)+(mx===1?' mark':' marks')+')</span>':'',lab=num+'. ';
    if(t==='fib'){
      const k=blanksOf(q);
      out+='<div class="q">'+mk+'<p>'+lab+E(q.text)+(/_{2,}/.test(q.text)?'':' ' +'__________________'.repeat(1))+'</p>'+(key&&q.answers?'<div class="cor">Answer: '+E(q.answers.map(a=>a[0]).join('; '))+'</div>':(k>1?'<div class="ans">'+Array.from({length:k},(_,i)=>(i+1)+'. ____________').join(' &nbsp; ')+'</div>':''))+'</div>';
    }else if(t==='theory'){
      const lines=Math.max(3,Math.min(10,Math.round(mx*1.5)));
      out+='<div class="q">'+mk+'<p>'+lab+E(q.text)+'</p>'+(key&&q.rubric&&q.rubric.length?'<div class="cor">Marking points: '+E(q.rubric.map(r=>r.kw).join('; '))+'</div>':Array.from({length:lines},()=>'<div class="wl"></div>').join(''))+'</div>';
    }else{
      const opts=q.options.map((o,k)=>'<span class="'+(key&&o.c?'right':'')+'">('+L[k]+') '+E(o.t)+(key&&o.c?' ✓':'')+'</span>').join('');
      out+='<div class="q">'+mk+'<p>'+lab+E(q.text)+'</p><div class="opts">'+opts+'</div></div>';
    }
  });
  return '<!doctype html><meta charset="utf-8"><title>'+E(ex.title)+'</title><style>'+AS_CSS+'.wl{border-bottom:1px solid #666;height:22px;margin-left:18px}</style><section class="sc">'+head+out+'</section>';
}
function asDoc(c,names,eid){
  const ex=c.exams.find(e=>e.id===eid);if(!ex)return '';
  const cf=rcCfg(),E=esc,L='abcdefghijklmnopqrstuvwxyz';
  const one=name=>{
    const r=resFor(c.id,name,eid);
    const head='<header>'+(cf.logo?'<img src="'+E(cf.logo)+'" alt="">':'')+'<h1>'+E(W.school||'School name')+'</h1>'+(cf.addr?'<p class="ad">'+E(cf.addr)+'</p>':'')+'</header>'+
      '<h2>'+E([cf.termName,ex.title].filter(Boolean).join(' — '))+(cf.year?' ('+E(cf.year)+')':'')+'</h2>'+
      '<div class="id"><span>NAME: '+E(name.toUpperCase())+'</span><span>CLASS: '+E(c.name.toUpperCase())+'</span><span>SUBJECT: '+E(String(ex.subject||'').toUpperCase())+'</span><span>DATE: '+(r?E(new Date(r.submittedAt).toLocaleDateString('en-GB')):'')+'</span></div>';
    if(!r)return '<section class="sc">'+head+'<p>'+E(name)+' has no submitted answers for this paper.</p></section>';
    const m=markExam(ex,r.ans||{},r.txt||{},MK[r.id]||null,ex.draw?r.ord:null);
    const n=ex.questions.length;
    let ord=Array.isArray(r.ord)?r.ord.filter(i=>Number.isInteger(i)&&i>=0&&i<n):[];
    if(!ord.length)ord=ex.questions.map((q,i)=>i);
    const stale=!sigOk(r,ex);
    const sum='<div class="sum"><span>SCORE: '+fmtN(m.score)+' / '+fmtN(m.total)+'</span><span>'+m.pct+'%</span><span>GRADE: '+m.grade+'</span>'+(m.prov?'<span>(provisional — written answers not yet marked)</span>':'')+'</div>';
    let out='',sec=null,num=0;
    ord.forEach(qi=>{
      const q=ex.questions[qi];if(!q)return;
      if(q.section!==sec){sec=q.section;const sm=m.secs.find(x=>x.name===(sec||''));out+='<div class="sh"><span>'+E(sec||'')+'</span>'+(sm&&sm.max?'<span>'+fmtN(sm.got)+' / '+fmtN(sm.max)+'</span>':'')+'</div>';}
      num++;
      const pt=m.parts.find(x=>x.qi===qi),t=qType(q),lab=num+'. ';
      const mk=pt?'<span class="mk '+(pt.got>=pt.max?'g':(pt.got>0?'':'b'))+'">'+fmtN(pt.got)+'/'+fmtN(pt.max)+(pt.got>=pt.max?' ✓':pt.got>0?'':' ✗')+'</span>':'';
      if(t==='fib'){
        const given=(r.txt&&r.txt[qi])||[],g=Array.isArray(given)?given:[given];
        const ok=pt&&pt.got>=pt.max;
        out+='<div class="q">'+mk+'<p>'+lab+E(q.text)+'</p><div class="ans">Answer given: <span class="'+(ok?'right':'wrong')+'">'+(g.some(x=>String(x||'').trim())?E(g.map(x=>x||'–').join('; ')):'no answer')+'</span></div>'+(ok||!q.answers?'':'<div class="cor">Correct: '+E(q.answers.map(a=>a[0]).join('; '))+'</div>')+'</div>';
        return;
      }
      if(t==='theory'){
        const v=String((r.txt&&r.txt[qi])||'').trim();
        out+='<div class="q">'+(pt&&(pt.state==='unmarked'||pt.state==='suggested')?'<span class="mk">not yet marked /'+fmtN(pt.max)+'</span>':mk)+'<p>'+lab+E(q.text)+'</p><div class="box">'+(v?E(v):'<i>No answer</i>')+'</div></div>';
        return;
      }
      const perm=(r.perm&&r.perm[qi])||q.options.map((o,k)=>k);
      const chosen=(r.ans&&r.ans[qi])||[];
      const ok=pt&&pt.got>=pt.max;
      const opts=perm.map((orig,k)=>{
        const o=q.options[orig];if(!o)return '';
        const on=chosen.includes(orig);
        let cls='',mark='';
        if(on&&o.c){cls='pick right';mark=' ✓';}else if(on){cls='pick wrong';mark=' ✗';}else if(o.c&&!ok){cls='right';mark=' ✓';}
        return '<span class="'+cls+'">('+L[k]+') '+E(o.t)+mark+'</span>';
      }).join('');
      out+='<div class="q">'+mk+'<p>'+lab+E(q.text)+'</p><div class="opts">'+opts+'</div>'+(chosen.length?'':'<div class="ans wrong">No answer</div>')+'</div>';
    });
    return '<section class="sc">'+head+sum+out+'<p class="note">Underlined = the answer given. ✓ right, ✗ wrong; the correct answer is shown in green. Questions are in the order this pupil saw them.'+(stale?' This paper was edited after the pupil sat it, so some marks may differ from what was awarded.':'')+'</p></section>';
  };
  return '<!doctype html><meta charset="utf-8"><title>'+E(ex.title+' answer scripts')+'</title><style>'+AS_CSS+'</style>'+names.map(one).join('');
}

function stateChip(pt){
  if(pt.type==='theory'&&pt.state==='suggested')return '<span class="prov-badge">Suggested, not confirmed</span>';
  if(pt.state==='unmarked')return '<span class="prov-badge">Needs a mark</span>';
  if(pt.state==='adjusted')return '<span class="badge warn">Changed by teacher</span>';
  if(pt.state==='confirmed')return '<span class="badge ok">Confirmed</span>';
  return '';
}
function reviewList(c,e,r,name){
  if(!sigOk(r,e)||!r._m)return '<p class="muted sm" style="margin:8px 0">This paper was edited after '+esc(name)+' wrote it, so the answers can no longer be matched to the questions.</p>';
  const written=r._m.parts.some(p=>p.type!=='obj');
  return '<div class="row" style="margin:8px 0"><button class="btn small" data-act="mk-go" data-e="'+esc(e.id)+'" data-n="'+esc(name)+'">'+(written?'Mark or change marks':'Change marks')+'</button></div><div class="review">'+r._m.parts.map(pt=>{
    const q=e.questions[pt.qi],lab='<b>'+esc(qLab(e,pt.qi))+'.</b> ',mk=' <span class="muted sm">('+fmtN(pt.got)+'/'+fmtN(pt.max)+')</span>';
    const ok=pt.got>=pt.max;
    let det='';
    if(pt.type==='fib'){
      const g=(r.txt&&r.txt[pt.qi])||[];
      det='<p class="muted">Answered: '+(g.some(x=>String(x||'').trim())?esc(g.map(x=>x||'–').join('; ')):'no answer')+'</p><p class="muted sm">Accepted: '+esc(q.answers.map(a=>a.join(' / ')).join('; '))+'</p>';
    }else if(pt.type==='theory'){
      const v=String((r.txt&&r.txt[pt.qi])||'').trim();
      det='<div class="ans-box">'+(v?esc(v):'<span class="muted">'+(pt.paper?'Written on paper':'No answer')+'</span>')+'</div>'+(pt.paper?'':'<div class="chips">'+(pt.hits||[]).map(h=>'<span class="chip '+h.state+'">'+(h.state==='full'?'✓ ':h.state==='near'?'~ ':'')+esc(h.kw)+'</span>').join('')+'</div>');
    }else{
      const a=(r.ans[pt.qi]||[]).slice().sort((x,y)=>x-y),cor=q.options.map((o,k)=>o.c?k:-1).filter(k=>k>=0);
      det='<p class="muted">Answered: '+(a.length?esc(a.map(k=>q.options[k].t).join('; ')):'no answer')+'</p>'+(ok?'':'<p style="color:var(--ok);font-weight:600">Correct: '+esc(cor.map(k=>q.options[k].t).join('; '))+'</p>');
    }
    return '<div class="rv '+(ok?'good':'miss')+'"><p>'+lab+esc(q.text)+mk+' '+stateChip(pt)+'</p>'+det+'</div>';
  }).join('')+'</div>';
}


function qPreview(q,i){
  const lab=q.no?q.no+(q.sub||''):String(i+1),t=qType(q);
  const mk=qMarkable(q)?' <span class="muted sm">['+fmtN(qMax(q))+(qMax(q)===1?' mark':' marks')+']</span>':'';
  const tag=t==='fib'?'<span class="badge">Fill in</span> ':t==='theory'?'<span class="badge">Theory</span> ':'';
  let tail='';
  if(t==='obj')tail=q.options.map((o,k)=>'<span class="o'+(o.c?' c':'')+'">'+String.fromCharCode(97+k)+'. '+esc(o.t)+(o.c?'  ✓':'')+'</span>').join('');
  else if(t==='fib')tail=(q.answers||[]).map((a,b)=>'<span class="o c">'+((q.answers||[]).length>1?'Blank '+(b+1)+': ':'Answer: ')+esc(a.join(' / '))+'</span>').join('');
  else tail=(q.rubric||[]).length?'<span class="o c">Keywords: '+esc(q.rubric.map(x=>x.kw.join('/')+(x.m!=null?' ('+x.m+')':'')).join(' · '))+'</span>':'<span class="o">No keywords, so this one is marked by hand.</span>';
  return '<li class="pv-q"><b>'+esc(lab)+'.</b> '+tag+esc(q.text)+mk+tail+'</li>';
}
function examSummary(e){
  if(e.ext)return 'Entered by the teacher · '+fmtN(e.max||0)+' marks';
  const n=t=>e.questions.filter(q=>qType(q)===t).length;
  const bits=[];
  if(n('obj'))bits.push(n('obj')+' multiple choice');
  if(n('fib'))bits.push(n('fib')+' fill-in');
  if(n('theory'))bits.push(n('theory')+' theory');
  return (bits.join(', ')||'0 questions')+' · '+fmtN(examTotal(e))+' marks';
}

const TPL_HEAD='# Basic 6 Mid-Term Test\n## Basic Science\nNote: Heading 1 is the test title and Heading 2 the subject. Replace the sample text with your own. Lines that start with Note: are ignored when you upload, so you can leave them in.';
const TPL_OBJ='### Section A – Multiple choice | 6 marks\nNote: Give each question a number, then its options as a. b. c. d. Put [CORRECT] after the right option. Tag more than one option for a "choose all that apply" question. The section’s marks are shared equally between its questions.\n1. The organ that pumps blood around the body is the\na. lungs\nb. kidney\nc. heart [CORRECT]\nd. liver\n2. Which of these is a source of light?\na. The Moon\nb. The Sun [CORRECT]\nc. A mirror\nd. A window\n3. Which of these are mammals? Choose all that apply.\na. Frog\nb. Bat [CORRECT]\nc. Whale [CORRECT]\nd. Lizard';
const TPL_FIB='### Section B – Fill in the blank | 2 marks each\nNote: Mark each gap with ____ (four underscores) and give the answer on the line after it, starting Answer:. Put other accepted answers or spellings after a | sign. For two gaps in one question use Answer 1: and Answer 2:. Numbers such as 1,000 and 1000 count as the same. A one-letter spelling slip in a longer word earns half marks.\n1. Plants make their food by a process called ____.\nAnswer: photosynthesis\n2. The capital of Nigeria is ____ and its largest city is ____.\nAnswer 1: Abuja\nAnswer 2: Lagos\n3. Water boils at ____ degrees Celsius.\nAnswer: 100 | one hundred';
const TPL_THEORY='### Section C – Theory | 20 marks\nNote: Put a question’s marks in square brackets at the end, for example [6 marks]. Questions with no marks share what is left of the section’s marks equally. For parts use 2a. and 2b. The Rubric line lists what a good answer should contain, separated by | . Write alternatives with / . A number in brackets after a keyword gives it that many marks, for example chlorophyll (2). The computer ticks the keywords it finds, and you confirm or change the mark. Leave the Rubric line out to mark by hand.\n1. Explain how a green plant makes its food. [6 marks]\nRubric: sunlight / light | carbon dioxide / CO2 | water | chlorophyll (2) | glucose / sugar | oxygen\n2a. State two uses of water to a plant. [3 marks]\nRubric: transport / transports | photosynthesis | support | cooling\n2b. Name one gas that plants give out in the day. [2 marks]\nRubric: oxygen\n3. Describe how to care for a plant at home.\nRubric: water | sunlight / light | soil | weeding / weed | fertiliser / fertilizer';
const TPL_KINDS=[['obj','Multiple choice','multiple-choice questions'],['fib','Fill in the blank','fill-in-the-blank questions'],['theory','Theory','theory questions'],['all','All question types','a mixed paper']];

  const zip=new JSZip();

  zip.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  zip.file('word/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles '+W2+'><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="100"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'+hs(1,36)+hs(2,30)+hs(3,26)+'</w:styles>');
  zip.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document '+W2+'><w:body>'+paras+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');

const tplName=kind=>(wlOn()?'Question template - ':'ExamDesk template - ')+(TPL_KINDS.find(k=>k[0]===kind)||TPL_KINDS[3])[1]+'.docx';
async function saveTemplate(kind){
  const st=S.st;st.fallback=null;
  try{
    const blob=await tplDocx(kind),d=await getDownloads();
    if(d){await d.save({filename:tplName(kind),data:blob});toast('Saved '+tplName(kind));return;}
  }catch(e){if(e&&e.code==='declined')return;}
  st.fallback={name:tplName(kind).replace(/\.docx$/,'.txt'),data:tplText(kind)};

/* ---------- marking ---------- */
const provParts=r=>r&&r._m?r._m.parts.filter(p=>p.type==='theory'&&(p.state==='suggested'||p.state==='unmarked')):[];
function hlText(text,hits){
  const st={};
  (hits||[]).forEach(h=>{if(h.state==='no'||!h.found)return;String(h.found).split(' ').forEach(w=>{if(st[w]!=='full')st[w]=h.state;});});
  return String(text).split(/(\s+)/).map(w=>{
    if(!w)return '';
    if(/^\s+$/.test(w))return esc(w);
    const pm=/^([^A-Za-z0-9\u00C0-\u024F]*)(.*?)([^A-Za-z0-9\u00C0-\u024F]*)$/.exec(w),k=st[normText(pm[2])];
    return k?esc(pm[1])+'<mark class="hit'+(k==='near'?' near':'')+'">'+esc(pm[2])+'</mark>'+esc(pm[3]):esc(w);
  }).join('');
}
function markHist(r,pt,ex){
  const rec=MK[r.id]&&MK[r.id][pt.qi];
  if(!rec||!rec.h||!rec.h.length)return '';
  return '<details><summary class="sm">Change record ('+rec.h.length+')</summary><div class="hist"><span>Computer: '+(pt.type==='theory'&&pt.state!=='confirmed'&&pt.state!=='adjusted'?fmtN(pt.auto):fmtN(pt.auto))+'</span>'+rec.h.map(h=>'<span>'+esc(fmtDate(h.at))+' · '+esc(h.by)+' · '+fmtN(h.from)+' → '+fmtN(h.m)+'</span>').join('')+'</div></details>';
}
function mkCard(ex,r,pt){
  const q=ex.questions[pt.qi],lab=qLab(ex,pt.qi),t=pt.type;
  let body='';
  if(t==='fib'){
    const g=(r.txt&&r.txt[pt.qi])||[];
    body='<div class="stack" style="gap:6px">'+(q.answers||[]).map((alts,b)=>{
      const v=String(g[b]==null?'':g[b]).trim(),res=(pt.res||[])[b]||'no';
      return '<div class="row" style="gap:8px;align-items:baseline"><span class="muted sm">'+((q.answers||[]).length>1?'Blank '+(b+1)+':':'Answer:')+'</span><span class="ans-box" style="padding:4px 10px">'+(v?esc(v):'<span class="muted">blank</span>')+'</span>'+
        (res==='full'?'<span class="badge ok">Correct</span>':res==='near'?'<span class="badge warn">Spelling slip, half marks</span>':v?'<span class="badge bad">Not matched</span>':'<span class="badge">Blank</span>')+
        '<span class="muted sm">Accepted: '+esc(alts.join(' / '))+'</span>'+
        (v&&res!=='full'&&!ME?'<button class="btn small ghost" data-act="mk-accept" data-r="'+esc(r.id)+'" data-e="'+esc(ex.id)+'" data-q="'+pt.qi+'" data-b="'+b+'">Accept this answer</button>':'')+'</div>';
    }).join('')+'</div>';
  }else if(t==='theory'){
    const v=String((r.txt&&r.txt[pt.qi])||'').trim();
    if(pt.paper)body='<p class="muted">Written on paper. Enter the mark you gave it.</p>';
    else body='<div class="ans-box">'+(v?hlText(v,pt.hits):'<span class="muted">No answer</span>')+'</div>'+
      ((pt.hits||[]).length?'<div class="chips" aria-label="Keywords">'+pt.hits.map(h=>'<span class="chip '+h.state+'">'+(h.state==='full'?'✓ ':h.state==='near'?'~ ':'')+esc(h.kw)+' <span class="muted">('+fmtN(h.m)+')</span></span>').join('')+'</div><p class="muted sm">Suggested: '+fmtN(pt.auto)+' of '+fmtN(pt.max)+'. Ticks are the computer’s; you decide the mark.</p>':'<p class="muted sm">This question has no keywords, so it is marked by hand.</p>');
  }else{
    const a=(r.ans[pt.qi]||[]).slice().sort((x,y)=>x-y),cor=q.options.map((o,k)=>o.c?k:-1).filter(k=>k>=0);
    body='<p class="muted">Answered: '+(a.length?esc(a.map(k=>q.options[k].t).join('; ')):'no answer')+' · Correct: '+esc(cor.map(k=>q.options[k].t).join('; '))+'</p>';
  }
  const showVal=pt.state!=='unmarked';
  const sug=t==='theory'&&pt.state==='suggested';
  return '<div class="mkq'+(pt.state==='adjusted'?' adj':'')+'"><div class="row" style="justify-content:space-between;align-items:flex-start"><p><b>'+esc(lab)+'.</b> '+(t==='fib'?'<span class="badge">Fill in</span> ':t==='theory'?'<span class="badge">Theory</span> ':'')+esc(q.text)+'</p><span class="mono sm">'+fmtN(pt.got)+' / '+fmtN(pt.max)+'</span></div>'+body+
    '<div class="markbox"><label class="sm" for="mk-'+pt.qi+'">Mark (0 to '+fmtN(pt.max)+')</label><input type="number" id="mk-'+pt.qi+'" min="0" max="'+pt.max+'" step="0.25" inputmode="decimal" value="'+(showVal?pt.got:'')+'">'+
    '<button class="btn small primary" data-act="mk-save" data-r="'+esc(r.id)+'" data-q="'+pt.qi+'">Save mark</button>'+
    (sug?'<button class="btn small" data-act="mk-confirm" data-r="'+esc(r.id)+'" data-q="'+pt.qi+'" data-v="'+pt.auto+'">Confirm '+fmtN(pt.auto)+'</button>':'')+' '+stateChip(pt)+'</div>'+markHist(r,pt,ex)+'</div>';
}
function markPanel(c,ex,name,r){

  const parts=r._m.parts,written=parts.filter(p=>p.type!=='obj'),objs=parts.filter(p=>p.type==='obj');

    '<div><span class="eyebrow">'+esc(ex.subject)+'</span><h2>'+esc(name)+'</h2><p class="mono">'+fmtN(r.score)+' / '+fmtN(r.total)+' · '+r.pct+'% · grade '+r.grade+(r.prov?' · provisional':'')+'</p></div>'+

}
function tabMarking(c){
  const st=S.st;
  const exs=c.exams.filter(e=>e.questions.some(q=>qType(q)!=='obj'&&qMarkable(q))&&(!ME||c.roster.concat(classNames(c).orphans).some(n=>canActR({cid:c.id,name:n,eid:e.id}))));
  if(!exs.length)return '<section class="card">'+emptyBox('No written questions yet','Papers with fill-in-the-blank or theory questions are checked and marked here.')+'</section>';
  const ex=exs.find(e=>e.id===st.mex)||exs[0];
  const nm=classNames(c),all=nm.roster.concat(nm.orphans);
  const rows=all.map(n=>({n,r:resFor(c.id,n,ex.id)})).filter(x=>x.r);
  const open=rows.reduce((a,x)=>a+provParts(x.r).length,0),sugg=rows.reduce((a,x)=>a+provParts(x.r).filter(p=>p.state==='suggested').length,0);
  const who=ME?'<p class="sm" style="align-self:end">Marking as <b>'+esc(ME.name)+'</b></p>':'<label class="f" style="min-width:200px">Your name<span class="hint">Kept in the change record</span><input type="text" id="mk-name" data-mkname="1" value="'+esc(markerName())+'" autocomplete="name" placeholder="For example, Mrs Ade"></label>';
  const sel='<label class="f" style="min-width:240px">Paper<select id="m-exam" data-bind="st.mex">'+exs.map(e=>'<option value="'+esc(e.id)+'"'+(e.id===ex.id?' selected':'')+'>'+esc(e.subject)+'</option>').join('')+'</select></label>';
  const sel2=st.mchild&&rows.find(x=>nk(x.n)===nk(st.mchild));
  if(sel2)return '<div class="stack"><section class="card"><div class="row">'+sel+who+'</div></section>'+markPanel(c,ex,sel2.n,sel2.r)+'</div>';
  const table=rows.length?'<div class="scroll"><table><thead><tr><th>Name</th><th class="num">Score</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(x=>{
    const pp=provParts(x.r);
    return '<tr><td>'+esc(x.n)+'</td><td class="num mono">'+fmtN(x.r.score)+'/'+fmtN(x.r.total)+'</td><td>'+(pp.length?'<span class="prov-badge">'+pp.length+' to confirm</span>':'<span class="badge ok">Final</span>')+'</td><td><button class="btn small'+(pp.length?' primary':'')+'" data-act="mk-open" data-n="'+esc(x.n)+'">'+(pp.length?'Mark':'Review')+'</button></td></tr>';
  }).join('')+'</tbody></table></div>':emptyBox('Nobody has written this paper yet','Once children submit, their written answers appear here.');
  return '<div class="stack"><section class="card stack"><div class="row">'+sel+who+'</div>'+
    '<p class="muted">The computer marks fill-in-the-blank answers and ticks the keywords it finds in theory answers. Theory scores stay <b>provisional</b> until you confirm or change each one.'+(ex.theoryMode==='paper'?' This paper’s theory is written on paper, so enter those marks yourself.':'')+'</p>'+
    (rows.length?'<div class="row" style="justify-content:space-between"><p class="mono sm">'+rows.length+' written · '+open+' theory mark'+(open===1?'':'s')+' to confirm</p>'+(sugg?'<button class="btn small" data-act="mk-confirm-all" data-e="'+esc(ex.id)+'">Confirm all '+sugg+' suggested marks</button>':'')+'</div>':'')+
    table+'</section></div>';
}

/* Scores typed in from outside ExamDesk (a mid-term written on paper, an exam sat elsewhere). Admin only. A blank score stays blank, so the report card stays incomplete until it is filled. */
const extGet=(ex,name)=>{const k=nk(name);for(const n of Object.keys(ex.scores||{}))if(nk(n)===k)return {v:ex.scores[n],a:false};for(const n of Object.keys(ex.abs||{}))if(ex.abs[n]&&nk(n)===k)return {v:0,a:true};return null;};
extRes=(ex,cid,name)=>{
  const g=extGet(ex,name);if(!g||!(ex.max>0))return null;
  const pct=Math.round(g.v/ex.max*100);
  return {id:'ext:'+ex.id+'|'+nk(name),cid,eid:ex.id,name,score:g.v,total:ex.max,pct,pass:pct>=(ex.passMark==null?50:ex.passMark),grade:gradeOf(pct),prov:false,ext:true,absent:g.a,submittedAt:0};
};
function extSet(ex,name,val){
  const k=nk(name);ex.scores=ex.scores||{};ex.abs=ex.abs||{};
  Object.keys(ex.scores).forEach(n=>{if(nk(n)===k)delete ex.scores[n];});Object.keys(ex.abs).forEach(n=>{if(nk(n)===k)delete ex.abs[n];});
  if(val==='abs')ex.abs[name]=true;else if(typeof val==='number')ex.scores[name]=val;
}
/* '' clears, 'abs' marks absent, a number must sit between 0 and the paper's total, anything else is refused (undefined) */
function extParse(txt,max){
  const t=String(txt==null?'':txt).trim();if(!t)return '';
  if(/^(a|abs|absent)$/i.test(t))return 'abs';
  const v=Number(t.replace(',','.'));if(!isFinite(v)||v<0||v>max)return undefined;
  return Math.round(v*100)/100;
}
function extApply(c,ex,pairs){
  let ok=0;const bad=[],lost=[];
  pairs.forEach(([nm,raw])=>{
    const n=c.roster.find(x=>nk(x)===nk(nm));
    if(!n){lost.push(nm);return;}
    const v=extParse(raw,ex.max);
    if(v===undefined){bad.push(nm);return;}
    extSet(ex,n,v);ok++;
  });
  saveW();reindex();
  return {ok,bad,lost};
}
function extReport(r){
  const bits=[r.ok+' score'+(r.ok===1?'':'s')+' saved'];
  if(r.lost.length)bits.push(r.lost.length+' name'+(r.lost.length>1?'s':'')+' not on the class list ('+r.lost.slice(0,3).join(', ')+(r.lost.length>3?'…':'')+')');
  if(r.bad.length)bits.push(r.bad.length+' not a valid mark ('+r.bad.slice(0,3).join(', ')+(r.bad.length>3?'…':'')+')');
  return bits.join('. ')+'.';
}
function extPairs(text,c){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const bare=l=>/^(a|abs|absent|\d+([.,]\d+)?)$/i.test(l);
  if(lines.length&&lines.every(bare)){
    if(lines.length!==c.roster.length)return {err:'You pasted '+lines.length+' scores but the class has '+c.roster.length+' children. Paste the name and score together, or one score per child in class-list order.'};
    return {pairs:lines.map((l,i)=>[c.roster[i],l])};
  }
  const pairs=[];
  lines.forEach((l,i)=>{
    const m=l.match(/^(.*?)[\t;,]\s*([^\t;,]*)\s*$/)||l.match(/^(.*\S)\s+(\S+)$/);
    if(!m)return;
    if(i===0&&!bare(m[2])&&!c.roster.some(x=>nk(x)===nk(m[1])))return;   // a header line
    pairs.push([m[1].trim(),m[2].trim()]);
  });
  return pairs.length?{pairs}:{err:'Nothing could be read. Paste one child per line, like: Ada Okafor, 34'};
}
extChange=(t,file)=>{
  const st=S.st,c=cls(st.cid),ex=c&&c.exams.find(x=>x.id===t.dataset.xe&&x.ext);if(!ex)return false;
  if(file){
    return (async()=>{
      try{
        const sheets=await readWorkbook(t.files[0]);const rows=(sheets[0]&&sheets[0].rows)||[];
        let nc=0,sc=1;
        const hi=rows.findIndex(r=>r.some(x=>/name/i.test(String(x)))&&r.some(x=>/score|mark/i.test(String(x))));
        if(hi>=0){nc=rows[hi].findIndex(x=>/name/i.test(String(x)));sc=rows[hi].findIndex(x=>/score|mark/i.test(String(x)));}
        const pairs=rows.slice(hi+1).filter(r=>String(r[nc]||'').trim()).map(r=>[String(r[nc]).trim(),String(r[sc]==null?'':r[sc])]);
        if(!pairs.length)throw new Error('empty');
        st.flash=extReport(extApply(c,ex,pairs));
      }catch(e){st.err=e.message==='nolib'?'The spreadsheet reader did not load. Paste the scores instead.':'That file could not be read. It needs a Name column and a Score column.';}
      render();
    })();
  }
  const k=t.dataset.xk;
  if(k==='max'){
    const v=parseFloat(t.value);if(!(v>0)||v>1000){toast('Enter what the paper is out of, for example 20.');t.value=ex.max;return true;}
    const over=Object.values(ex.scores||{}).filter(x=>x>v).length;
    if(over){toast('Some scores are higher than '+v+'. Fix those first.');t.value=ex.max;return true;}
    ex.max=Math.round(v*100)/100;saveW();reindex();render();return true;
  }
  if(t.dataset.xs!==undefined){
    const v=extParse(t.value,ex.max);
    if(v===undefined){toast('Marks must be between 0 and '+ex.max+', or A for absent.');const g=extGet(ex,t.dataset.xs);t.value=g?(g.a?'A':g.v):'';return true;}
    extSet(ex,t.dataset.xs,v);saveW();reindex();
    const el=document.getElementById('xc-'+ex.id);if(el)el.textContent=c.roster.filter(n=>extGet(ex,n)).length+'/'+c.roster.length+' entered';
    return true;
  }
  return false;
};

function qToText(q,n){
  const t=qType(q),mk=q.marks!=null?' ['+q.marks+(q.marks===1?' mark':' marks')+']':'';
  let o=(n?n+'. ':'')+q.text+mk;
  if(t==='obj')o+=(q.options||[]).map((x,k)=>'\n'+String.fromCharCode(97+k)+'. '+x.t+(x.c?' [CORRECT]':'')).join('');
  else if(t==='fib')(q.answers||[]).forEach((a,k)=>{o+='\n'+((q.answers||[]).length>1?'Answer '+(k+1):'Answer')+': '+a.join(' | ');});
  else o+='\nRubric: '+(q.rubric||[]).map(r=>r.kw.join(' / ')+(r.m!=null?' ('+r.m+')':'')).join(' | ');
  return o;
}
function parseOneQ(txt){
  const r=parseText('# T\n## S\n### Section\n1. '+String(txt||'').trim().replace(/^\d{1,3}[\.\)]\s+/,''));
  const qs=r.exams.length?r.exams[0].questions:[];
  if(!qs.length)return {err:'Give the question its options (a. b. c. d., with [CORRECT] after the right one), or an Answer: line for a fill-in question, or a Rubric: line for a theory question.'};
  if(qs.length>1)return {err:'Put one question in the box. Use the paper builder to combine questions.'};
  const q=qs[0],t=qType(q);
  if(t==='obj'&&(q.options.length<2||!q.options.some(o=>o.c)))return {err:'A multiple-choice question needs at least two options and one marked [CORRECT].'};
  const out={type:t,text:q.text,marks:q.marks!=null?q.marks:1};
  if(t==='obj')out.options=q.options.map(o=>({t:o.t,c:!!o.c}));
  if(t==='fib')out.answers=q.answers||[];
  if(t==='theory')out.rubric=q.rubric||[];
  return {q:out};
}

async function genRun(replaceId){
  const b=bankSt(),g=b.gf;if(b.busy)return;
  if(!replaceId&&!String(g.subject).trim()){b.err='Type the subject first.';render();return;}
  b.busy=replaceId||true;b.err='';b.msg='';render();
  try{
    const body=replaceId?{replaceId}:{subject:g.subject,level:g.level,topic:g.topic,type:g.type,count:Math.max(1,Math.min(20,parseInt(g.count,10)||10)),difficulty:g.difficulty,notes:g.notes};
    const {r,j}=await bankReq('/api/generate',{method:'POST',body:JSON.stringify(body)});
    if(r.ok&&j&&j.ok){
      if(replaceId)b.items=(b.items||[]).filter(x=>x.id!==replaceId);
      b.items=j.items.concat(b.items||[]);
      if(SRVS.lic)SRVS.lic.gen=j.gen;
      b.msg=replaceId?(j.charged?'Replaced. That used one generation, because the two free replacements for this set are used up.':'Replaced for free. '+j.replaceLeft+' free replacement'+(j.replaceLeft===1?'':'s')+' left for this set.'):j.items.length+' draft question'+(j.items.length===1?'':'s')+' added below. Check every answer before you accept it.';
    }else b.err=genErr(r.status,j);
  }catch(e){b.err='Could not reach the server. You were not charged.';}
  b.busy=false;render();
}
async function bankSave(list,del){
  const b=bankSt();
  const {r,j}=await bankReq('/api/bank',{method:'PUT',body:JSON.stringify({items:list||[],del:del||[]})});
  if(!(r.ok&&j&&j.ok)){b.err=r.status===402?'This school’s licence is not active, so the bank cannot be changed.':r.status===401?'Sign in again, then try again.':'That did not save ('+r.status+').';return false;}
  const map=new Map((b.items||[]).map(x=>[x.id,x]));
  (j.items||[]).forEach(x=>map.set(x.id,x));
  (del||[]).forEach(id=>map.delete(id));
  b.items=[...map.values()].sort((x,y)=>y.at-x.at);
  return true;

function bqHtml(q){

  const tag=t==='fib'?'<span class="badge">Fill in</span> ':t==='theory'?'<span class="badge">Theory</span> ':'';
  let tail='';
  if(t==='obj')tail=(q.options||[]).map((o,k)=>'<span class="o'+(o.c?' c':'')+'">'+String.fromCharCode(97+k)+'. '+esc(o.t)+(o.c?'  ✓':'')+'</span>').join('');

}

async function tcPut(list){
  const st=S.st,tc=st.tc,h2=ses.get(K_H2);
  if(!h2){tc.err='Sign out and sign in again, then try once more.';render();return false;}
  tc.busy=true;tc.err='';render();
  let ok=false;
  try{
    const r=await srvFetch('/api/teachers',{method:'PUT',headers:{'content-type':'application/json','x-admin':h2},body:JSON.stringify({teachers:list})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){tc.list=j.teachers;ok=true;}
    else if(j.error==='duplicate_name')tc.err='Another teacher already has the name “'+(j.name||'')+'”.';
    else if(j.error==='same_as_admin')tc.err='“'+(j.name||'')+'” cannot use the administrator’s passcode.';
    else if(j.error==='passcode_needed')tc.err='“'+(j.name||'')+'” needs a passcode.';
    else if(j.error==='plan')tc.err='This school’s plan does not include teacher accounts.';
    else if(/^licence_/.test(j.error||''))tc.err='Changes cannot be saved because of the licence ('+j.error.replace('licence_','')+'). Contact your ExamDesk provider.';
    else if(r.status===401){tc.err='The administrator passcode was not accepted. Sign out and sign in again.';ses.del(K_H2);}
    else tc.err='Saving did not go through ('+r.status+').';
  }catch(e){tc.err='Could not reach the server.';}
  tc.busy=false;render();return ok;
}
async function tcSave(){
  const st=S.st,tc=st.tc,f=tc.form;
  const name=cleanName(f.name);
  if(!name){tc.err='Type the teacher’s name.';render();return;}
  const pass=f.pass||'';
  if((!f.id&&pass.length<8)||(pass&&pass.length<8)){tc.err='The passcode needs at least 8 characters.';render();return;}
  const entry={name,form:f.form.filter(x=>x.cid).map(x=>({cid:x.cid,arm:x.arm||''})),subj:f.subj.filter(x=>x.cid&&x.subject).map(x=>({cid:x.cid,subject:x.subject}))};
  if(f.id)entry.id=f.id;
  if(f.officer)entry.officer=true;
  if(pass)entry.h2=await hash2(pass);
  const list=tc.list.map(t=>t.id===f.id?entry:{id:t.id,name:t.name,form:t.form,subj:t.subj,officer:t.officer});
  if(!f.id)list.push(entry);
  if(await tcPut(list)){tc.form=null;st.flash=name+' saved.';render();}
}

const SA=!!document.getElementById('xd-lib-xlsx');   // standalone build (own host, libraries inside the page)
function anchorSave(filename,data){
  const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=filename;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},4000);
}
async function getDownloads(){

}
async function saveSheets(base,sheets){
  const st=S.st;st.fallback=null;
  const d=await getDownloads();
  if(d&&window.XLSX){
    try{
      const wb=XLSX.utils.book_new();
      sheets.forEach(s=>{
        const ws=XLSX.utils.aoa_to_sheet(s.rows);
        if(s.widths)ws['!cols']=s.widths.map(w=>({wch:w}));
        XLSX.utils.book_append_sheet(wb,ws,s.name.replace(/[\[\]\*\?\/\\:]/g,' ').slice(0,31));
      });
      const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});

      toast('Saved '+safeName(base)+'.xlsx');return;
    }catch(e){if(e&&e.code==='declined')return;}
  }
  st.fallback={name:safeName(base)+'.csv',data:'﻿'+sheets[0].rows.map(r=>r.map(csvCell).join(',')).join('\r\n')};

  const body=rows.map((r,i)=>[i+1,r.name].concat(hasArms?[armOf(c,r.name)]:[],r.cells.map(x=>x?(x.prov?x.score+' (provisional)':x.score):'Not written'),[r.done?r.score:'',r.done?r.total:'',r.avg==null?'':r.avg,r.avg==null?'':gradeOf(r.avg)],pos?[pos.has(nk(r.name))?pos.get(nk(r.name)):'']:[]));
  const avgRow=['','Class average'].concat(hasArms?['']:[],c.exams.map(e=>{const g=all.map(n=>resFor(c.id,n,e.id)).filter(Boolean);return g.length?Math.round(g.reduce((a,r)=>a+r.pct,0)/g.length*10)/10+'%':'';}));

  return [{name:'Broadsheet',rows:[head].concat(body,[[],avgRow]),widths:[5,28].concat(c.exams.map(()=>16),[8,8,11,7,9])},{name:'All results',rows:det,widths:[28,22,22,8,8,9,7,16,12,20,10]}];

function childSheets(c,name){
  const row=childRow(c,name);
  const rows=[['Name',name],['Class',c.name],[],['Subject','Test','Score','Out of','Percent','Grade','Result','Written','Time used']];
  c.exams.forEach((e,i)=>{const r=row.cells[i];rows.push(r?[e.subject,e.title,r.score,r.total,r.pct,r.grade,r.prov?'Provisional':(r.pass?'Pass':'Below pass mark'),fmtDate(r.submittedAt),fmtClock(r.usedSec)]:[e.subject,e.title,'','','','','Not written','','']);});

async function act(a,el){
  const st=S.st;
  switch(a){
    case 'staff':st.err='';go('staff');break;
    case 'home':st.flash='';go('home');break;
    case 'done':S.res=null;S.form.eid='';S.form.name='';S.form.code='';go('home');break;
    case 'check':await beginCheck();break;
    case 'start':startExam();break;
    case 'pick':{
      const s=S.ses,{e,q}=curQ(),orig=e.perm[+el.dataset.k];
      let cur=(s.ans[s.idx]||[]).slice();
      if(isMulti(q)){cur=cur.includes(orig)?cur.filter(x=>x!==orig):cur.concat(orig);}else cur=[orig];
      s.ans[s.idx]=cur;persist();render();break;}
    case 'clear':delete S.ses.ans[S.ses.idx];if(S.ses.txt)delete S.ses.txt[S.ses.idx];persist();render();break;
    case 'flag':S.ses.flags[S.ses.idx]=!S.ses.flags[S.ses.idx];persist();render();break;
    case 'nav':S.ses.idx=+el.dataset.p;persist();render();break;
    case 'prev':if(S.ses.idx>0){S.ses.idx--;persist();render();}break;
    case 'next':if(S.ses.idx<S.ses.qs.length-1){S.ses.idx++;persist();render();}break;
    case 'submit-open':S.confirmSubmit=true;render();break;
    case 'submit-cancel':S.confirmSubmit=false;render();break;
    case 'submit-now':finish(false);break;

    case 'setup':{
      if(st.p1.length<8){st.err='Use at least 8 characters.';render();break;}
      if(st.p1!==st.p2){st.err='The two passcodes do not match.';render();break;}
      W.adminHash=await hash(st.p1);saveW();ses.set(K_AUTH,W.adminHash);try{ses.set(K_H2,await hash2(st.p1));}catch(e){}st.authed=true;st.err='';st.p1=st.p2='';render();break;}
    case 'login':{
      if(W.adminHash==='srv'){

          const j=await r.json().catch(()=>({}));

            await syncServer();
